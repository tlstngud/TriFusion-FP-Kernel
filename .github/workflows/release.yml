name: publish-to-pypi
run-name: Publish ${{ inputs.tag || github.event.release.tag_name }} to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'tlstngud/TriFusion-FP-Kernel' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Download and verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" == v[0-9]* ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft > release.json
          python -c 'import json, os; r = json.load(open("release.json")); assert not r["isDraft"] and r["tagName"] == os.environ["RELEASE_TAG"]'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir incoming --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          python scripts/verify_release.py "$RELEASE_TAG" incoming dist
      - name: Check package metadata and installed CLI
        run: |
          python -m pip install 'twine>=6,<8'
          python -m twine check --strict dist/*
          python -m pip install --no-deps dist/*.whl
          trifusion-l4 --version
          trifusion-l4 info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/trifusion-fp-kernel
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
